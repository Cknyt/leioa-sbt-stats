# Descarga los partidos, genera la web y la sube al hosting por FTP.
# Solo se ejecuta a mano (pestaña Actions > Publicar web > Run workflow): el usuario decide
# cuándo publicar. Las ejecuciones automáticas (cada lunes y al llegar código a main) están
# quitadas; para recuperarlas, vuelve a añadir los bloques schedule y push en "on".
#
# Configuración (Settings > Secrets and variables > Actions):
# - Secretos: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# - Variables: FTP_SERVER_DIR (carpeta del hosting, terminada en "/", por ejemplo
#   /public_html/leioa/) y, si hace falta, FTP_PROTOCOL (ftps por defecto; también ftp).
# Sin los secretos, genera la web igualmente (descargable como artefacto) pero no la sube.
name: Publicar web

on:
  workflow_dispatch:

# Nunca dos publicaciones a la vez.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' && vars.FTP_SERVER_DIR != '' }}
      HAS_REPORT_KEY: ${{ secrets.INFORME_CLAVE != '' }}
      HAS_TELEGRAM: ${{ secrets.TELEGRAM_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6

      - name: Instalar dependencias
        run: uv sync --locked

      # Los partidos ya descargados se guardan entre ejecuciones: solo se piden los nuevos.
      - name: Recuperar partidos descargados
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Descargar partidos
        run: uv run python -m leioa_stats.download

      - name: Validar datos
        run: uv run python -m leioa_stats.validate | tail -n 1

      - name: Generar la web
        run: uv run python -m leioa_stats.web

      # Contraseña del informe de visitas: se guarda solo su huella (hash) en informe-clave.php.
      # El archivo es PHP, así que desde internet no se puede leer. Sin el secreto
      # INFORME_CLAVE no se crea y el informe queda desactivado.
      - name: Clave del informe de visitas
        if: env.HAS_REPORT_KEY == 'true'
        env:
          INFORME_CLAVE: ${{ secrets.INFORME_CLAVE }}
        run: |
          php -r '
            $hash = password_hash(getenv("INFORME_CLAVE"), PASSWORD_DEFAULT);
            file_put_contents("site/informe-clave.php", "<?php return " . var_export($hash, true) . ";" . PHP_EOL);
          '

      - name: Guardar la web como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: site/
          retention-days: 14

      # Aviso por Telegram de cada visita nueva: registrar.php lee el token y el chat de
      # telegram-config.php. Aquí no sirve una huella como la de la contraseña del informe: para
      # escribir a Telegram hace falta el token tal cual. El archivo es PHP, así que desde
      # internet no se puede leer. Sin los dos secretos no se crea y el aviso queda desactivado.
      # Va después de guardar el artefacto para que el token no quede en él.
      - name: Configuración del aviso por Telegram
        if: env.HAS_TELEGRAM == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          php -r '
            $config = ["token" => trim(getenv("TELEGRAM_TOKEN")), "chat" => trim(getenv("TELEGRAM_CHAT_ID"))];
            file_put_contents("site/telegram-config.php", "<?php return " . var_export($config, true) . ";" . PHP_EOL);
          '

      - name: Subir al hosting
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./site/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          # datos/ guarda el diario de visitas que escribe registrar.php en el hosting: la
          # publicación no debe tocarlo. Las tres primeras líneas son las exclusiones por defecto.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            datos/**

      - name: Aviso si falta la configuración del hosting
        if: env.HAS_FTP != 'true'
        run: >
          echo "::warning::No se ha subido la web: faltan los secretos FTP_SERVER, FTP_USERNAME o
          FTP_PASSWORD, o la variable FTP_SERVER_DIR. La web generada está en los artefactos."
