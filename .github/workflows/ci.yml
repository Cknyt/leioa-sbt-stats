# Ejecuta los tests y ruff en cada Pull Request y en cada cambio que llega a main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6

      - name: Instalar dependencias
        # --locked: falla si uv.lock no está al día con pyproject.toml.
        run: uv sync --locked

      # Los archivos PHP se ejecutan en el hosting: se comprueba que no tiene errores de sintaxis.
      # Sus tests (tests/test_visits.py) usan el PHP que ya trae ubuntu-latest.
      - name: Sintaxis PHP
        run: for f in src/leioa_stats/web/php/*.php; do php -l "$f" || exit 1; done

      - name: Tests
        run: uv run python -m pytest

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .
